[tool.poetry]
name = "openclawd-example-by-framework-langchain"
version = "0.1.0"
description = "OpenClawd example for Langchain with web3.py"
authors = ["Andrea Villa <andreakarimodm@gmail.com>"]
readme = "README.md"
keywords = ["openclawd", "sdk", "web3", "agents", "ai"]
homepage = "https://openclawd.dev/"
repository = "https://github.com/openclawd/openclawd"
packages = [
    { include = "example.py" },
]

[tool.poetry.dependencies]
python = "^3.12"
langchain = ">=0.3.2"
langchain-openai = ">=0.2.14"
python-dotenv = "^1.0.1" 
web3 = ">=6.20.3"
openclawd = "^0.1.0"
openclawd-wallet-evm = "^0.1.0"
openclawd-wallet-web3 = "^0.1.0"
openclawd-adapter-langchain = "^0.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/openclawd/openclawd/issues"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
pythonpath = "src"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"
openclawd = { path = "../../../src/openclawd", develop = true }
openclawd-wallet-evm = { path = "../../../src/wallets/evm", develop = true }
openclawd-wallet-web3 = { path = "../../../src/wallets/web3", develop = true }
openclawd-adapter-langchain = { path = "../../../src/adapters/langchain", develop = true }

[tool.ruff]
line-length = 120
target-version = "py312"
