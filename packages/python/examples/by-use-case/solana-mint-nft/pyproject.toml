[tool.poetry]
name = "openclawd-example-by-use-case-solana-mint-nft"
version = "0.1.0"
description = "OpenClawd example for minting NFTs on Solana using Crossmint"
authors = ["OpenClawd <info@openclawd.com>"]
readme = "README.md"
keywords = ["openclawd", "sdk", "solana", "agents", "ai", "nft", "crossmint"]
homepage = "https://openclawd.dev/"
repository = "https://github.com/openclawd/openclawd"
packages = [
    { include = "index.py" },
]

[tool.poetry.dependencies]
python = "^3.12"
langchain = "*"
langchain-openai = "*"
python-dotenv = "*"
solana = {version = ">=0.30.2", extras = ["spl"]}
solders = ">=0.18.0"
openclawd = "*"
openclawd-wallet-solana = "*"
openclawd-wallet-crossmint = "*"
openclawd-adapter-langchain = "*"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-asyncio = "*"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/openclawd/openclawd/issues"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
pythonpath = "src"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"
openclawd = { path = "../../../src/openclawd", develop = true }
openclawd-wallet-solana = { path = "../../../src/wallets/solana", develop = true }
openclawd-wallet-crossmint = { path = "../../../src/wallets/crossmint", develop = true }
openclawd-adapter-langchain = { path = "../../../src/adapters/langchain", develop = true }

[tool.ruff]
line-length = 120
target-version = "py312" 