[tool.poetry]
name = "openclawd-plugin-superfluid"
version = "0.1.1"
description = "OpenClawd plugin for Superfluid"
authors = [
    "Andrea Villa <andreakarimodm@gmail.com>",
]
readme = "README.md"
keywords = [
    "openclawd",
    "sdk",
    "web3",
    "agents",
    "ai",
]
homepage = "https://openclawd.dev/"
repository = "https://github.com/openclawd/openclawd"
packages = [
    { include = "openclawd_plugins/superfluid" },
]

[tool.poetry.dependencies]
python = "^3.10"
openclawd = "^0.1.1"
openclawd-wallet-evm = "^0.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"

[tool.poetry.group.dev.dependencies.openclawd]
path = "../../openclawd"
develop = true

[tool.poetry.group.dev.dependencies.openclawd-wallet-evm]
path = "../../wallets/evm"
develop = true

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/openclawd/openclawd/issues"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"
