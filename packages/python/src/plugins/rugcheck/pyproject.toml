[tool.poetry]
name = "openclawd-plugin-rugcheck"
version = "0.1.3"
description = "A Python rugcheck plugin for the OpenClawd"
authors = [
    "OpenClawd Team",
]
packages = [
    { include = "openclawd_plugins" },
]

[tool.poetry.dependencies]
python = "^3.9"
openclawd = "^0.1.1"
aiohttp = "^3.8.4"
pydantic = "^2.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "."
