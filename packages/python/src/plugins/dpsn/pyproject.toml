[tool.poetry]
name = "openclawd-plugin-dpsn"
version = "0.1.0"
description = "OpenClawd plugin for dpsn-plugin"
authors = ["Your Name <your_email@example.com>"]
readme = "README.md"
keywords = ["openclawd", "sdk", "agents", "ai", "dpsn-plugin"]
homepage = "https://openclawd.dev/"
repository = "https://github.com/openclawd/openclawd"
packages = [{ include = "openclawd_plugins/dpsn" }]

[tool.poetry.dependencies]
python = "^3.10"
openclawd = "^0.1.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/openclawd/openclawd/issues"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = "src"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"
openclawd = { path = "../../openclawd", develop = true }

[tool.ruff]
line-length = 120
target-version = "py312"
