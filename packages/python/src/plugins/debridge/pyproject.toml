[tool.poetry]
name = "openclawd-plugin-debridge"
version = "0.1.0"
description = "OpenClawd plugin for deBridge"
authors = ["Ofem Eteng <ofemeteng@gmail.com>"]
readme = "README.md"
keywords = ["openclawd", "sdk", "agents", "ai", "debridge"]
homepage = "https://openclawd.dev/"
repository = "https://github.com/openclawd/openclawd"
packages = [
    { include = "openclawd_plugins/debridge" },
]

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = "^3.8.6"
openclawd = "^0.1.0"
pydantic = "^2.0.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/openclawd/openclawd/issues"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
]
pythonpath = "src"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"
openclawd = { path = "../../openclawd", develop = true }

[tool.ruff]
line-length = 120
target-version = "py312"
