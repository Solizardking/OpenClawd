[tool.poetry]
name = "openclawd-plugin-uniswap"
version = "0.1.2"
description = "OpenClawd plugin for uniswap"
authors = [
    "Your Name <your_email@example.com>",
]
readme = "README.md"
keywords = [
    "openclawd",
    "sdk",
    "agents",
    "ai",
    "uniswap",
]
homepage = "https://openclawd.dev/"
repository = "https://github.com/openclawd/openclawd"
packages = [
    { include = "openclawd_plugins/uniswap" },
]

[tool.poetry.dependencies]
python = "^3.10"
openclawd = "^0.1.0"
openclawd-wallet-evm = "^0.1.1"
openclawd-wallet-web3 = "^0.1.3"
openclawd-plugin-erc20 = "^0.1.0"
aiohttp = "^3.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"

[tool.poetry.group.dev.dependencies.openclawd]
path = "../../openclawd"
develop = true

[tool.poetry.group.dev.dependencies.openclawd-wallet-evm]
path = "../../wallets/evm"
develop = true

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/openclawd/openclawd/issues"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = "src"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = [
    "poetry-core",
]
build-backend = "poetry.core.masonry.api"
