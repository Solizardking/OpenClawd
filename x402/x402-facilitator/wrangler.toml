# X402 Multi-Chain Facilitator - Cloudflare Worker Configuration

name = "x402-facilitator"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

# Workers Paid Plan required for KV
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = true

# KV Namespace for payment receipts
[[kv_namespaces]]
binding = "RECEIPTS"
id = "YOUR_KV_NAMESPACE_ID"
preview_id = "YOUR_KV_PREVIEW_NAMESPACE_ID"

# Environment Variables
[vars]
ENVIRONMENT = "development"

# Production configuration
[env.production]
name = "x402-facilitator-prod"
workers_dev = false

[env.production.vars]
ENVIRONMENT = "production"

# Bot Management (Enterprise feature)
# Automatically adds cf-bot-score, cf-verified-bot, cf-bot-managed headers
# https://developers.cloudflare.com/bots/

# Secrets (set via wrangler secret put)
# SOLANA_RPC_URL
# SOLANA_TREASURY
# BASE_RPC_URL (optional)
# EVM_TREASURY (optional)
# BITCOIN_RPC_URL (optional)
# BITCOIN_TREASURY (optional)

# Usage:
# wrangler secret put SOLANA_RPC_URL
# wrangler secret put SOLANA_TREASURY
# wrangler secret put BASE_RPC_URL
# wrangler secret put EVM_TREASURY

# Build configuration
# Wrangler handles TypeScript compilation natively for ES module workers
# No custom build command needed when main = "src/index.ts"

# Routes (optional - customize based on your domain)
# [[routes]]
# pattern = "facilitator.your-domain.com/*"
# zone_name = "your-domain.com"

# Development
[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"
