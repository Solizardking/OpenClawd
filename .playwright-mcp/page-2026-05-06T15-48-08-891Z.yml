        - generic [ref=e42]:
          - paragraph [ref=e43]: Onchain birth certificate
          - heading "Mint a Blockchain Buddy on Solana." [level=1] [ref=e44]
          - paragraph [ref=e45]: Each buddy is created as an MPL Core asset and registered through the Metaplex Agent Registry in one atomic transaction. Helius RPC powers submission, OpenClawd supplies the agent framework, and the returned Core asset address becomes the buddy's permanent onchain identity.
        - generic [ref=e46]:
          - paragraph [ref=e47]: Before minting
          - list [ref=e48]:
            - listitem [ref=e49]:
              - img [ref=e50]
              - text: Fund the server mint authority with SOL for Core asset rent and transaction fees.
            - listitem [ref=e54]:
              - img [ref=e55]
              - text: "Set `HELIUS_RPC_URL` and `BUDDIES_MINT_AUTHORITY_SECRET_KEY` in the deployment environment."
            - listitem [ref=e58]:
              - img [ref=e59]
              - text: Host metadata JSON publicly before birth; Metaplex stores the URI on the Core asset.
      - generic [ref=e62]:
        - article [ref=e63]:
          - paragraph [ref=e64]: Agent onboarding
          - heading "Canonical Metaplex flow" [level=2] [ref=e65]
          - paragraph [ref=e66]: "Blockchain Buddies follows the Metaplex Agent Onboarding path: funded wallet, RPC setup, Core asset registration, identity PDA, agent wallet activation, optional delegation, and optional token launch."
        - article [ref=e67]:
          - paragraph [ref=e68]: Mint an agent
          - heading "Born as a Core asset" [level=2] [ref=e69]
          - paragraph [ref=e70]:
            - text: The server calls
            - code [ref=e71]: mintAndSubmitAgent
            - text: from the Metaplex Agent Registry SDK. The Metaplex API stores agent metadata, returns an unsigned transaction, and the OpenClawd mint authority signs it through Umi.
        - article [ref=e72]:
          - paragraph [ref=e73]: Run on Solana
          - heading "Wallet, delegation, token" [level=2] [ref=e74]
          - paragraph [ref=e75]: The returned Core asset address derives the buddy's Asset Signer PDA wallet. That identity can later be delegated to an executive profile or bound to a Genesis agent token.
      - generic [ref=e77]:
        - generic [ref=e78]:
          - paragraph [ref=e79]: What this page automates
          - heading "A verifiable onchain birth record." [level=2] [ref=e80]
          - paragraph [ref=e81]: Use this page when an OpenClawd operator or agent has a funded Solana authority and a public metadata URI ready. The flow records the mint in the app database so the hub can track the buddy, owner, asset address, transaction signature, RPC provider, and Metaplex network.
        - list [ref=e82]:
          - listitem [ref=e83]:
            - strong [ref=e84]: "Prerequisite:"
            - text: a funded Solana wallet with enough SOL for Core asset rent and transaction fees.
          - listitem [ref=e85]:
            - strong [ref=e86]: "Mainnet:"
            - text: configure a dedicated Helius RPC URL; the public devnet endpoint is only suitable for testing.
          - listitem [ref=e87]:
            - strong [ref=e88]: "Permanent identity:"
            - text: each successful birth creates a new agent asset. Calling the mint flow twice creates two different buddies.
          - listitem [ref=e89]:
            - strong [ref=e90]: "Next step:"
            - text: derive the Asset Signer PDA, register an executive profile, then delegate execution or launch a Genesis bonding-curve token.
