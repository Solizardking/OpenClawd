[package]
name = "openclawd-agent-staking"
version = "0.1.0"
description = "OpenClawd agent staking protocol for Metaplex Core assets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openclawd_agent_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
]

[dependencies]
# anchor-lang 0.30.1 is what mpl-core 0.9.x peers against. Do not bump without
# verifying mpl-core's anchor-lang dep range first (`cargo tree -p mpl-core`).
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# anchor-spl is intentionally NOT a dependency — this program does not touch SPL
# tokens; it only CPIs into mpl-core. Keeping anchor-spl out avoids a transitive
# spl-token-2022 / solana-zk-sdk conflict with anchor-spl 0.32.x.
mpl-core = { version = "0.9", features = ["anchor"] }
