[package]
name = "openclawd-agent-staking"
version = "0.1.0"
description = "OpenClawd agent staking protocol for Metaplex Core assets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openclawd_agent_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
]

[dependencies]
# Pinned to match the locally installed anchor-cli 0.32.1.
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
# bytemuck is transitively pulled by anchor-lang; pinning here for explicit visibility.
bytemuck = "1.16.1"
# Pin mpl-core minor version. 0.8.1 introduced a `solana_pubkey` switch that broke
# the `anchor` feature build under anchor-lang 0.30.x; 0.9.x is the first release
# fully aligned with the new pubkey crate.
mpl-core = { version = "0.9", features = ["anchor"] }
