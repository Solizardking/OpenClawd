[package]
name = "openclawd-agent-staking"
version = "0.1.0"
description = "OpenClawd agent staking protocol for Metaplex Core assets"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openclawd_agent_staking"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
]

[dependencies]
# anchor-lang 0.31 is the first version that bridges to solana-program 2.x while
# remaining compatible with mpl-core 0.9's `solana_pubkey` types.
anchor-lang = { version = "0.31", features = ["init-if-needed"] }
# anchor-spl is intentionally NOT a dependency — this program only CPIs into
# mpl-core. Keeping it out avoids the spl-token-2022 / solana-zk-sdk conflict.
mpl-core = { version = "0.12", features = ["anchor"] }
